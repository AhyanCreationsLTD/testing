name: Global IPTV Segmented Fast Sync with PAT

on:
  schedule:
    - cron: '0 * * * *'  # প্রতি ১ ঘণ্টা পর পর অটো-রান হবে
  workflow_dispatch:     # ম্যানুয়ালি যেকোনো সময় রান করার অপশন

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # আপনার রেপো সিক্রেটসে সেভ করা কাস্টম PAT টোকেন ব্যবহার করা হচ্ছে
          token: ${{ secrets.IPTV_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests pycountry

      - name: Run Global Segmented Fast Script
        run: python update_iptv.py

      - name: Commit & Push Changes
        run: |
          git config --global user.name "Ahyan IPTV Bot"
          git config --global user.email "bot@ahyancreations.top"
          
          git add -A  
          # ফাইল বা ডেটাতে পরিবর্তন আসলেই কেবল পুশ করবে
          git diff --quiet && git diff --staged --quiet || (git commit -m "Global IPTV Super-Fast Sync: $(date -u)" && git push)
          
