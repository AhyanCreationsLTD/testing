name: Ultimate Multi-Source IPTV Auto Update Engine

on:
  schedule:
    # ⏰ প্রতিদিন বাংলাদেশ সময় সকাল ৬টায় অটোমেটিক রান হবে (UTC 00:00)
    - cron: '0 0 * * *'
  workflow_dispatch: # গিটহাব ড্যাশবোর্ড থেকে যখন খুশি ম্যানুয়ালি রান করার বাটন

permissions:
  contents: write  # channels.json ফাইলে নতুন ডাটা পুশ করার পারমিশন লকড

jobs:
  build-and-sync:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Contents
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
        cache: 'pip' # দ্রুত ডিপেন্ডেন্সি বিল্ড করার ক্যাশ মেমোরি

    - name: Install High-Performance HTTP Request Library
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run Master Aggregator and Dead Link Cleaner Script
      run: python update_iptv.py  # 👈 আপনার ফাইলের নাম অনুযায়ী পারফেক্টলি ট্যাগড

    - name: Commit and Push Cleaned Premium channels.json
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        git add channels.json
        # যদি নতুন কোনো চ্যানেল আপডেট না থাকে, তবে ক্র্যাশ না করে স্কিপ করবে
        git diff-index --quiet HEAD || git commit -m "⚡ Sync & Cleaned: Multi-Source Master Channels Database [Auto]"
        git push
        
