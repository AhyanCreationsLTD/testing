name: Global IPTV Auto-Clean Super-Fast Sync

on:
  schedule:
    - cron: '0 * * * *'  # ঘড়ির কাঁটা ধরে ঠিক প্রতি এক ঘণ্টা পর পর অটোমেটিক চালু হবে
  workflow_dispatch:     # আপনার প্রয়োজনে যেকোনো সময় টেস্ট বা ম্যানুয়ালি রান করার জন্য

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.IPTV_TOKEN }} # আপনার রেপো সিক্রেটসের PAT টোকেন

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests pycountry

      - name: Clean Old Scrapped Files
        run: |
          # 🪠 প্রথমে আগের রানের সব দেশের ডাইনামিক ফোল্ডার এবং মেইন ফাইলগুলো পারফেক্টলি ডিলিট করবে
          find . -maxdepth 1 -type d ! -name ".*" ! -name "Global" ! -name ".github" -exec rm -rf {} + 2>/dev/null || true
          rm -rf Global
          rm -f channels.json channels.m3u
          printenv
          echo "আগের সব ফাইল ও ডেড ফোল্ডার সফলভাবে ডিলিট করা হয়েছে।"

      - name: Run Global Segmented Fast Script
        run: python update_iptv.py

      - name: Commit & Push Changes
        run: |
          git config --global user.name "Ahyan IPTV Bot"
          git config --global user.email "bot@ahyancreations.top"
          
          git add -A  
          # নতুন ও সচল ফাইলগুলো ফ্রেশভাবে গিটহাবে পুশ করে আপডেট করে দেবে
          git diff --quiet && git diff --staged --quiet || (git commit -m "Global IPTV Super-Fast Sync: $(date -u)" && git push)
          
