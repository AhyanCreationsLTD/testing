name: Ultimate Multi-Source IPTV Auto Update Engine

on:
  schedule:
    # ⏰ প্রতি ১ ঘণ্টা পর পর স্বয়ংক্রিয়ভাবে ব্যাকএন্ডে রান হবে
    - cron: '0 * * * *'
  workflow_dispatch: # গিটহাব ড্যাশবোর্ড থেকে যখন খুশি ম্যানুয়ালি রান করার বাটন

jobs:
  build-and-sync:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Contents
      uses: actions/checkout@v4
      with:
        # টোকেন দিয়ে চেকআউট করলে পরবর্তী পুশ অ্যাকশনটি ফুল রাইট পারমিশন পায়
        token: ${{ secrets.IPTV_TOKEN }}

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.x' # ক্যাশ অপশন রিমুভড, তাই কোনো এরর আসবে না

    - name: Install High-Performance HTTP Request Library
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run Master Aggregator and Dead Link Cleaner Script
      run: python update_iptv.py

    - name: Commit and Push Cleaned Premium Data Formats
      env:
        GITHUB_TOKEN: ${{ secrets.IPTV_TOKEN }}
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        
        # 📂 নতুন তৈরি হওয়া দুটি ফাইলই ট্র্যাকিংয়ে অ্যাড করা হলো
        git add channels.json
        git add playlist.m3u
        
        # ফাইলে কোনো রিয়েল চেঞ্জ থাকলেই শুধু পুশ হবে, নয়তো স্কিপ করবে (এরর প্রোটেকশন)
        if ! git diff-index --quiet HEAD; then
          git commit -m "⚡ Hourly Sync: Channels JSON & M3U Playlist Compiled [Auto]"
          git push https://x-access-token:${{ secrets.IPTV_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ github.ref_name }}
        else
          echo "No new stream updates found this hour. Skipping push to avoid redundancy."
        fi
        
