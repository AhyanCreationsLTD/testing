<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>পেজটি খুঁজে পাওয়া যায়নি | 404 Error</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a; /* ডার্ক ব্যাকগ্রাউন্ড */
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .error-container {
            max-width: 500px;
        }
        h1 {
            font-size: 8rem;
            font-weight: 800;
            color: #3b82f6; /* নীল রঙের টেক্সট */
            line-height: 1;
            margin-bottom: 10px;
        }
        h2 {
            font-size: 1.8rem;
            margin-bottom: 15px;
            color: #e2e8f0;
        }
        p {
            font-size: 1rem;
            color: #94a3b8;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .home-btn {
            display: inline-block;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            background-color: #3b82f6;
            text-decoration: none;
            border-radius: 8px;
            transition: background 0.3s ease;
        }
        .home-btn:hover {
            background-color: #2563eb;
        }
    </style>
</head>
<body>

    <div class="error-container">
        <h1>404</h1>
        <h2>দুঃখিত! পেজটি খুঁজে পাওয়া যায়নি</h2>
        <p>আপনি যে লিংকটি খুঁজছেন তা হয়তো পরিবর্তন করা হয়েছে অথবা এর অস্তিত্ব নেই। অনুগ্রহ করে লিংকটি আবার চেক করুন অথবা নিচের বাটনে ক্লিক করে হোম পেজে ফিরে যান।</p>
        <a href="https://tv.ahyancreations.top" class="home-btn">হোম পেজে ফিরে যান</a>
    </div>

</body>
</html>
